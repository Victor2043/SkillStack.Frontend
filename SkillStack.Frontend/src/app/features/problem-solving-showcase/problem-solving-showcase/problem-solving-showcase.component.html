<div class="showcase-container">
  <h2 class="showcase-title">{{ 'PROBLEM-SOLVING.TITLE' | translate }}</h2>
  <p class="showcase-subtitle">{{ 'PROBLEM-SOLVING.SUBTITLE' | translate }}</p>

  <div class="timeline">
    <div class="timeline-item" *ngFor="let item of timelineItems; trackBy: trackByFn">
      <div class="timeline-year">{{ item.year | translate }}</div>
      <div class="timeline-content">
        <h3 class="company-name">{{ item.company | translate }}</h3>
        <ul class="achievements-list">
          <li class="achievement" *ngFor="let achievement of item.achievements">
            <span class="achievement-icon">{{ achievement.icon }}</span>
            <div>
              <h4>{{ achievement.title | translate }}</h4>
              <p class="achievement-desc">{{ achievement.description | translate }}</p>
            </div>
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>
